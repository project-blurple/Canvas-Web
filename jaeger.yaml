service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

pipelines:
  traces:
    receivers: [otlp]
    processors: [batch]
    exporters: [jaeger_storage_exporter]

telemetry:
  resource:
    service.name: jaeger
  metrics:
    level: detailed
    readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  logs:
    level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  jaeger_query:
    storage:
      traces: some_storage
      metrics: some_storage
    ui:
      log_access: true
    grpc:
      endpoint: 0.0.0.0:16685
    http:
      endpoint: 0.0.0.0:16686

  jaeger_storage:
    backends:
      some_storage:
        opensearch:
          server_urls:
            - http://opensearch:9200
          indices:
            index_prefix: "jaeger-main"
            spans:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            services:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            dependencies:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1
            sampling:
              date_layout: "2006-01-02"
              rollover_frequency: "day"
              shards: 5
              replicas: 1

exporters:
  jaeger_storage_exporter:
    trace_storage: some_storage
